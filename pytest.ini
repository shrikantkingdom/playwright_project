[pytest]
# Test discovery paths
testpaths = tests/step_defs

# Default markers
markers =
    ui: UI tests using Playwright
    api: API tests using HTTPX/Requests
    smoke: Smoke test suite (fast, critical paths)
    regression: Full regression test suite
    performance: Basic performance/response-time tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Pytest-HTML report output
addopts =
    --html=reports/report.html
    --self-contained-html
    -v
    --tb=short

# Retry flaky tests (pytest-rerunfailures)
# Override per run: pytest --reruns 2 --reruns-delay 1
