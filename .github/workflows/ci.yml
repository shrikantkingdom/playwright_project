name: Playwright Tests CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

jobs:
  # ── Smoke Tests (fast sanity check) ───────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (chromium only)
        run: playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p reports allure-results/smoke

      - name: Run smoke tests (API + UI critical path)
        env:
          ENV: qa
          BROWSER: chromium
          HEADLESS: "true"
          SAUCE_USERNAME: standard_user
          SAUCE_PASSWORD: secret_sauce
          API_BASE_URL: https://jsonplaceholder.typicode.com
        run: |
          pytest \
            -m smoke \
            --html=reports/smoke-report.html \
            --self-contained-html \
            --alluredir=allure-results/smoke \
            -v

      - name: Upload Smoke HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-html-report
          path: reports/smoke-report.html

      - name: Upload Smoke Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-allure-results
          path: allure-results/smoke/

  # ── API Tests ──────────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API tests (parallel)
        env:
          ENV: qa
          API_BASE_URL: https://jsonplaceholder.typicode.com
        run: |
          mkdir -p allure-results/api
          pytest tests/step_defs/api \
            -m api \
            -n auto \
            --reruns 2 \
            --reruns-delay 1 \
            --html=reports/api-report.html \
            --self-contained-html \
            --alluredir=allure-results/api \
            -v

      - name: Upload API HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-html-report
          path: reports/api-report.html

      - name: Upload API Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-allure-results
          path: allure-results/api/

  # ── UI Tests ───────────────────────────────────────────────────────────────
  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: smoke-tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Create reports directory
        run: mkdir -p reports/screenshots reports/videos reports/traces

      - name: Run UI tests
        env:
          ENV: qa
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          SAUCE_USERNAME: standard_user
          SAUCE_PASSWORD: secret_sauce
        run: |
          mkdir -p allure-results/ui-${{ matrix.browser }}
          pytest tests/step_defs/ui \
            -m ui \
            --reruns 2 \
            --reruns-delay 2 \
            --html=reports/ui-report-${{ matrix.browser }}.html \
            --self-contained-html \
            --alluredir=allure-results/ui-${{ matrix.browser }} \
            -v

      - name: Upload UI HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-html-report-${{ matrix.browser }}
          path: |
            reports/ui-report-${{ matrix.browser }}.html
            reports/screenshots/
            reports/videos/
            reports/traces/

      - name: Upload UI Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-allure-results-${{ matrix.browser }}
          path: allure-results/ui-${{ matrix.browser }}/

  # ── Lint & Format check ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: smoke-tests
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 . --max-line-length=88 --extend-ignore=E203,W503 --exclude=.git,__pycache__,.venv,reports

      - name: Check black formatting
        run: black --check --diff . --exclude '/(\.git|__pycache__|\.venv|reports)/'
